name: release

# Triggered on a tag push (vX.Y.Z) or manual dispatch. Builds + signs +
# publishes per-platform artifacts to the GitHub Release. Signing is
# CONDITIONAL on the relevant secrets being present:
#   - Desktop macOS:    CSC_LINK + CSC_KEY_PASSWORD + APPLE_ID +
#                       APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
#   - Desktop Windows:  WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD
#   - Mobile (EAS):     EXPO_TOKEN  (job gated on vars.EAS_ENABLED=='true')
#
# Without those secrets, the corresponding job still produces an UNSIGNED
# artifact (electron-builder emits the binary, EAS job skips). Operators
# can verify integrity via the per-artifact .sha256 sidecar.
#
# O-08 — Linux AppImage has no OS-level code-signing framework (unlike the
# Windows/macOS targets above, electron-updater's own update channel has
# nothing but a sha512 hash to check for it — see electron-builder's
# latest-linux.yml). A GPG detached signature (RELEASE_GPG_PRIVATE_KEY,
# optional) closes the gap for anyone who verifies manually; it does NOT
# change what electron-updater itself checks on auto-update. See
# SECURITY.md's "Linux AppImage updates" section.
#
# See SIGNING.md for every secret + where it comes from.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to upload artifacts to the GitHub Release

# MultX bridge — off unless the repository variables MULTX_ENABLED=true,
# MULTX_MANIFEST_URL and MULTX_MANIFEST_SHA256 are set (Settings → Secrets
# and variables → Actions → Variables). Each app reads its own prefix.
env:
  NEXT_PUBLIC_MULTX_ENABLED:         ${{ vars.MULTX_ENABLED || 'false' }}
  NEXT_PUBLIC_MULTX_MANIFEST_URL:    ${{ vars.MULTX_MANIFEST_URL }}
  NEXT_PUBLIC_MULTX_MANIFEST_SHA256: ${{ vars.MULTX_MANIFEST_SHA256 }}
  VITE_MULTX_ENABLED:                ${{ vars.MULTX_ENABLED || 'false' }}
  VITE_MULTX_MANIFEST_URL:           ${{ vars.MULTX_MANIFEST_URL }}
  VITE_MULTX_MANIFEST_SHA256:        ${{ vars.MULTX_MANIFEST_SHA256 }}

jobs:
  # ─── 1. Web — bundle the Next.js standalone output for the VPS ──────
  build-web:
    name: web (Next.js standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thanos/web build
        env:
          NEXT_PUBLIC_LITHO_RPC:        https://rpc.litho.ai
          NEXT_PUBLIC_REOWN_PROJECT_ID: 6d05d9a84112ca2f7c1bb77a76a18c81
          NEXT_PUBLIC_MULTX_API_URL:    https://bridge.litho.ai
          NEXT_PUBLIC_SENTRY_DSN:       ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:            ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:                   ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:               ${{ secrets.SENTRY_PROJECT }}
      - name: Tarball the standalone bundle + SHA-256
        run: |
          tar -czf web-dist-${GITHUB_REF_NAME}.tar.gz -C apps/web/.next standalone
          sha256sum web-dist-${GITHUB_REF_NAME}.tar.gz > web-dist-${GITHUB_REF_NAME}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: |
            web-dist-*.tar.gz
            web-dist-*.tar.gz.sha256
          retention-days: 30

  # ─── 2. Extension — zip the per-target builds ───────────────────────
  build-extension:
    name: extension (chrome + firefox + safari)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # WXT's `zip` script produces a ready-for-upload .zip per browser
      # target. Safari needs the macOS Xcode converter (run on a Mac);
      # the raw safari-mv2 build directory is the upstream input to that.
      # Copied out of .output after each build: upload-artifact v4 skips
      # hidden paths, so uploading from .output/ uploaded nothing.
      - name: Build Chrome and Firefox packages
        run: |
          mkdir -p extension-artifacts
          pnpm --filter @thanos/extension zip
          cp apps/extension/.output/*.zip extension-artifacts/
          pnpm --filter @thanos/extension zip:firefox
          cp apps/extension/.output/*.zip extension-artifacts/
      - name: Build Safari source package
        run: |
          pnpm --filter @thanos/extension build:safari
          cp -R apps/extension/.output/safari-mv2 extension-artifacts/
      - name: SHA-256 every artifact
        shell: bash
        run: |
          cd extension-artifacts
          for f in *.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zips
          if-no-files-found: error
          path: |
            extension-artifacts/*.zip
            extension-artifacts/*.sha256
            extension-artifacts/safari-mv2/
          retention-days: 30

  # ─── 3. Desktop — matrix across macOS + Windows + Linux ─────────────
  build-desktop:
    name: desktop (electron-builder, signed when secrets present)
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder.yml sets directories.output: release — NOT the
          # electron-builder default of "dist". These paths (and the
          # SHA-256 step below) must match that or every platform "succeeds"
          # while the upload step finds nothing (confirmed live in run
          # 34350856064: all three jobs failed at "No files were found with
          # the provided path" even though the actual build+package step had
          # already completed — this had apparently never worked, since
          # nothing before this session ever triggered a full release build
          # to notice: `gh release list` was empty).
          - os:     macos-latest
            target: mac
            artifact: 'apps/desktop/release/*.dmg'
          - os:     windows-latest
            target: win
            artifact: 'apps/desktop/release/*.exe'
          - os:     ubuntu-latest
            target: linux
            artifact: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node-gyp (used to compile keccak/blake-hash/tiny-secp256k1/
      # bigint-buffer from source when no prebuilt binary matches this
      # Electron ABI) needs Python's distutils, which was removed in
      # Python 3.12. GitHub's hosted runners default to 3.12+ across all
      # three OS images, so without this every one of those native deps
      # fails identically on Linux/macOS/Windows with "No module named
      # 'distutils'" — not a platform-specific issue, a runner-default
      # issue. Pin 3.11 (last version with distutils in the stdlib).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thanos/desktop build

      - name: Build + sign (macOS)
        if: matrix.target == 'mac'
        run: |
          # A GitHub secret that isn't configured arrives as an EMPTY STRING,
          # not unset. electron-builder treats an empty-but-defined CSC_LINK as
          # "a certificate was provided" and tries to read it from path "" —
          # which resolves to the cwd (apps/desktop) and fails with
          # "... not a file". When no cert is present, force a clean UNSIGNED
          # build: drop the empty vars and disable keychain auto-discovery.
          if [ -z "$CSC_LINK" ]; then
            echo "::notice::No macOS signing certificate configured — building UNSIGNED."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            NOTARIZE_FLAG=(-c.mac.notarize=false)
          elif [ -z "$APPLE_ID" ]; then
            echo "::notice::Signed but no Apple ID configured — build will be signed, NOT notarized."
            NOTARIZE_FLAG=(-c.mac.notarize=false)
          else
            echo "::notice::Signing + notarizing (APPLE_ID configured)."
            NOTARIZE_FLAG=(-c.mac.notarize=true)
          fi
          pnpm --filter @thanos/desktop exec electron-builder --mac --publish never "${NOTARIZE_FLAG[@]}"
        env:
          # When these are unset, electron-builder produces an unsigned build
          # instead of failing — useful for preview tags. Real releases set
          # all five, and the guard above then passes -c.mac.notarize=true:
          # electron-builder.yml's own notarize: false (O-08) doesn't read
          # these secrets by itself, so this step has to opt in explicitly.
          # (The CSC_LINK guard above also normalizes an empty-but-defined
          # secret to truly-unset.)
          CSC_LINK:                    ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

      - name: Build + sign (Windows)
        if: matrix.target == 'win'
        run: pnpm --filter @thanos/desktop exec electron-builder --win --publish never
        env:
          # WIN_CSC_LINK takes precedence over CSC_LINK on Windows so the
          # EV cert and the macOS Developer ID can coexist in the same
          # repo. EV signing on a YubiKey/HSM requires a self-hosted
          # Windows runner — see SIGNING.md §2.
          CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build (Linux — unsigned by design)
        if: matrix.target == 'linux'
        run: pnpm --filter @thanos/desktop exec electron-builder --linux --publish never

      - name: SHA-256 every artifact (operator-side verification)
        shell: bash
        run: |
          cd apps/desktop/release
          # Hash every artifact regardless of platform; users on every OS
          # verify the same way.
          for f in *.dmg *.exe *.AppImage *.deb *.zip; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      # O-08: the Linux AppImage's own auto-update channel (electron-updater)
      # verifies nothing but that sha256 — there's no OS-level code-signing
      # framework for AppImage the way Gatekeeper/Authenticode give the
      # macOS/Windows targets. A GPG detached signature doesn't change what
      # electron-updater checks, but it gives a manual verifier (`gpg
      # --verify`) something beyond "trust the hash in the same release
      # that might itself be compromised". Optional: skipped with a notice
      # when RELEASE_GPG_PRIVATE_KEY isn't configured.
      - name: GPG-sign the Linux AppImage (operator-side verification)
        if: matrix.target == 'linux'
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE:  ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "::notice::RELEASE_GPG_PRIVATE_KEY not set — AppImage ships with only a .sha256 sidecar (see SECURITY.md)."
            exit 0
          fi
          gpg --batch --import <<< "$RELEASE_GPG_PRIVATE_KEY"
          cd apps/desktop/release
          for f in *.AppImage; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" --detach-sign --armor -o "$f.sig" "$f"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            apps/desktop/release/*.sha256
            apps/desktop/release/*.sig
          if-no-files-found: error
          retention-days: 30

  # ─── 4. Mobile — EAS build + (optional) submit ──────────────────────
  build-mobile:
    name: mobile (EAS Build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip entirely when EAS_ENABLED isn't set as a repo variable —
    # the EAS CLI would otherwise prompt interactively. Operators flip
    # vars.EAS_ENABLED=true in the repo's Variables tab when the
    # Expo + Apple + Google accounts are wired (see SIGNING.md §3).
    if: ${{ vars.EAS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install EAS CLI
        run: npm install --global eas-cli@latest
      - name: EAS Build — iOS + Android (non-interactive, --no-wait)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios     --profile production --non-interactive --no-wait
          eas build --platform android --profile production --non-interactive --no-wait

  # ─── 5. GitHub Release — attach every artifact + auto-notes ─────────
  publish:
    name: publish GitHub release
    needs: [build-web, build-extension, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # full history so changelog auto-gen works
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Flatten artifact tree (release-page upload doesn't recurse)
        run: |
          mkdir -p flat
          find release-artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.zip' -o -name '*.sha256' \) \
            -exec cp {} flat/ \;
          ls -la flat/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name:               ${{ github.ref_name }}
          name:                   Thanos Wallet ${{ github.ref_name }}
          generate_release_notes: true
          files:                  flat/*
