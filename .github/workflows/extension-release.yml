name: Extension release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package browser extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build Chrome and Firefox packages
        run: |
          mkdir -p release-artifacts
          pnpm --filter @thanos/extension zip
          cp apps/extension/.output/*.zip release-artifacts/
          pnpm --filter @thanos/extension zip:firefox
          cp apps/extension/.output/*.zip release-artifacts/

      - name: Build Safari source package
        run: |
          pnpm --filter @thanos/extension build:safari
          cp -R apps/extension/.output/safari-mv2 release-artifacts/

      - name: Add SHA-256 checksums
        shell: bash
        run: |
          cd release-artifacts
          for file in *.zip; do
            [ -e "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thanos-extension-release
          path: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
            release-artifacts/safari-mv2/
          retention-days: 30
